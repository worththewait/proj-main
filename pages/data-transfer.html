<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据摆渡 · 百舸后台</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../user-role-admin.css?v=20261114-pagination" />
  <link rel="stylesheet" href="../data-transfer.css?v=20261119-task-records" />
  <link rel="stylesheet" href="../data-transfer-export.css?v=20261118-export-dates" />
  <link rel="stylesheet" href="../data-transfer-history.css?v=20261119-task-records" />
</head>
<body class="module-page transfer-body">
  <main class="module-main">
    <div class="content-scroll">
      <div class="content-inner transfer-page">
        <div class="transfer-workspace">
          <header class="transfer-title">
            <div class="transfer-title-copy">
              <div class="transfer-title-line">
                <h1>数据摆渡</h1>
                <span class="transfer-environment" id="transferEnvironment">内网 · 演示环境</span>
                <button class="iam-btn" type="button" id="transferSwitchEnvironment">切换到外网</button>
              </div>
              <p id="transferDescription">选择外网摆渡包，解析后自动导入。</p>
            </div>
            <div class="transfer-entry">
              <button class="primary-button" type="button" id="transferNewTask">导入</button>
              <input type="file" id="transferFile" accept=".json,application/json" hidden />
            </div>
            <div class="transfer-entry" id="transferExportEntry" hidden>
              <button class="primary-button" type="button" id="transferDownload" disabled>提交导出</button>
            </div>
          </header>
          <button class="transfer-link transfer-back" type="button" id="transferBack" hidden>返回导出记录</button>
          <section id="transferExport" hidden></section>
          <section id="transferHistory" hidden></section>
        </div>
      </div>
    </div>
  </main>

  <script src="../src/ui.js"></script>
  <script src="../src/data-transfer-demo.js?v=20261119-task-records"></script>
  <script src="../src/pages/data-transfer-export.js?v=20261118-export-dates"></script>
  <script src="../src/pages/data-transfer-history.js?v=20261119-task-records"></script>
  <script src="../src/pages/data-transfer.js?v=20261119-switch-message"></script>
</body>
</html>
