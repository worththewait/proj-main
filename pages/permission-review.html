<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>权限审核 · 百舸后台</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../admin.css" />
  <link rel="stylesheet" href="../permission-review.css?v=20261103-visual-baseline-no-badges" />
</head>
<body class="module-page" data-page="permission-review">
  <main class="module-main">
    <div class="content-scroll">
      <div class="content-inner pr-page">
        <header class="pr-head">
          <div><h1>权限审核</h1><p>查看功能与知识库权限申请，按申请项逐项审批。</p></div>
          <span class="pr-head-meta">审核身份：系统管理员</span>
        </header>
        <section class="pr-stats" id="prStats" aria-label="申请统计"></section>
        <div class="pr-toolbar">
          <label>申请人<input id="prApplicant" type="search" placeholder="姓名或账号" autocomplete="off" /></label>
          <label>状态<select id="prStatus"><option value="">全部状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="partial">部分通过</option><option value="rejected">已驳回</option></select></label>
          <label>功能/数据<input id="prFunction" type="search" placeholder="按申请项搜索" autocomplete="off" /></label>
          <button class="pr-reset" id="prReset" type="button">重置</button>
        </div>
        <div class="pr-table-wrap">
          <table class="pr-table">
            <thead><tr><th>申请编号</th><th>申请人</th><th>申请项</th><th>申请时间</th><th>状态</th><th>审核意见</th><th>操作</th></tr></thead>
            <tbody id="prTable"></tbody>
          </table>
        </div>
        <footer class="pr-foot"><span id="prSummary"></span><span>审批结果会实时同步到申请人的「我的申请」</span></footer>
      </div>
    </div>
  </main>

  <dialog class="pr-dialog" id="prDialog" aria-labelledby="prDialogTitle">
    <header class="pr-dialog-head"><h2 id="prDialogTitle">审核权限申请</h2><button class="pr-dialog-close" type="button" data-pr-close aria-label="关闭">×</button></header>
    <div class="pr-dialog-body">
      <dl class="pr-info" id="prInfo"></dl>
      <section class="pr-review-section">
        <div class="pr-review-head"><h3>申请项审核</h3><div class="pr-all-actions"><button type="button" data-pr-all="approved">全部通过</button><button type="button" data-pr-all="rejected">全部驳回</button></div></div>
        <div class="pr-review-items" id="prReviewItems"></div>
      </section>
      <div class="pr-comment"><label for="prComment">审核意见 <em>*</em></label><textarea id="prComment" maxlength="500" placeholder="请填写审核意见；通过或驳回时说明理由"></textarea><p class="pr-feedback" id="prFeedback" role="status"></p></div>
    </div>
    <footer class="pr-dialog-foot"><button class="pr-btn" type="button" data-pr-close>取消</button><button class="pr-btn is-primary" type="button" id="prSubmit">提交审核</button></footer>
  </dialog>
  <div class="pr-toast" id="prToast" role="status" aria-live="polite"></div>

  <script src="../src/ui.js"></script>
  <script src="../src/permission-store.js?v=20261102-permission"></script>
  <script src="../src/pages/permission-review.js?v=20261103-no-type-badges"></script>
</body>
</html>
