<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识库 · 百舸数智平台</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../knowledge.css?v=20261029-knowledge" />
</head>
<body class="module-page" data-page="knowledge">
  <main class="module-main">
    <div class="content-scroll" id="contentScroll">
      <div class="content-inner knowledge-hub" id="content">
        <header class="kb-hero">
          <h1>企业知识文档 <span>智能应用</span></h1>
          <p>统一管理行业、企业、部门与个人知识资源</p>
          <form class="kb-search" id="kbSearchForm" role="search">
            <label class="kb-search-field">
              <span data-icon="search" aria-hidden="true"></span>
              <input id="kbSearchInput" type="search" autocomplete="off" placeholder="输入文档名称或内容搜索" aria-label="输入文档名称或内容搜索" />
            </label>
            <select id="kbTypeFilter" aria-label="选择文件类型">
              <option value="all">选择文件类型</option>
              <option value="文档">文档</option>
              <option value="表格">表格</option>
              <option value="演示">演示</option>
              <option value="图片">图片</option>
              <option value="其他">其他</option>
            </select>
            <button class="kb-search-button" type="submit">搜索</button>
          </form>
        </header>

        <div id="kbSections"></div>

        <section class="kb-empty" id="kbEmpty" hidden>
          <span data-icon="search" aria-hidden="true"></span>
          <h2>没有找到匹配的知识库</h2>
          <p>试试其他关键词，或清空企业、部门和文件类型筛选。</p>
          <button class="kb-secondary-button" type="button" id="kbReset">清空筛选</button>
        </section>
      </div>
    </div>
  </main>

  <dialog id="kbEditDialog" class="kb-dialog" aria-labelledby="kbEditTitle">
    <form id="kbEditForm" novalidate>
      <header class="kb-dialog-head"><h2 id="kbEditTitle">编辑知识文档</h2><button class="kb-dialog-close" type="button" id="kbEditClose" aria-label="关闭">×</button></header>
      <div class="kb-dialog-body">
        <label class="kb-dialog-field"><span>名称</span><input id="kbEditName" type="text" maxlength="80" required /></label>
        <label class="kb-dialog-field"><span>类型</span><select id="kbEditType"><option>文档</option><option>表格</option><option>演示</option><option>图片</option><option>其他</option></select></label>
        <p class="kb-dialog-feedback" id="kbEditFeedback" role="status"></p>
      </div>
      <footer class="kb-dialog-foot"><button class="kb-secondary-button" type="button" id="kbEditCancel">取消</button><button class="kb-primary-button" type="submit">保存</button></footer>
    </form>
  </dialog>

  <dialog id="kbDeleteDialog" class="kb-dialog kb-confirm" aria-labelledby="kbDeleteTitle">
    <div class="kb-dialog-head"><h2 id="kbDeleteTitle">删除知识文档？</h2><button class="kb-dialog-close" type="button" id="kbDeleteClose" aria-label="关闭">×</button></div>
    <div class="kb-dialog-body"><p class="kb-confirm-copy">确定删除 <strong id="kbDeleteName"></strong>？删除后将从个人知识库中移除。</p></div>
    <footer class="kb-dialog-foot"><button class="kb-secondary-button" type="button" id="kbDeleteCancel">取消</button><button class="kb-primary-button kb-danger-button" type="button" id="kbDeleteConfirm">删除</button></footer>
  </dialog>

  <div class="kb-toast" id="kbToast" role="status" aria-live="polite"></div>

  <script src="../src/data.js"></script>
  <script src="../src/ui.js"></script>
  <script src="../src/page-bridge.js"></script>
  <script src="../src/pages/knowledge.js?v=20261029-knowledge"></script>
</body>
</html>
